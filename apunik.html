<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apurva &amp; Nikhil · Save the Date · 06 December 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#E4DDD5;display:flex;align-items:center;justify-content:center;padding:20px 12px;font-family:'Playfair Display',Georgia,serif}

.card{
  position:relative;
  width:min(480px,100%);
}

/* The invitation image */
.card img{
  width:100%;
  display:block;
  border-radius:2px;
  box-shadow:0 8px 32px rgba(50,30,10,.18),0 2px 8px rgba(50,30,10,.1);
}

/* Calendar button — floats over image at the date position */
.cal-btn{
  position:absolute;
  /* Sits just below the date text in the image — tweak top% if needed */
  bottom:21%;
  left:50%;
  transform:translateX(-50%);
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:11px 28px;
  background:rgba(250,245,235,0.92);
  border:0.5px solid rgba(180,140,40,.65);
  color:#6B4E10;
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(8px,2vw,11px);
  font-weight:400;
  letter-spacing:.32em;
  text-transform:uppercase;
  text-decoration:none;
  white-space:nowrap;
  border-radius:1px;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 12px rgba(100,70,10,.18);
  transition:background .3s,color .3s,box-shadow .3s;
}
.cal-btn:hover{
  background:rgba(139,105,20,.92);
  color:#FAF5E8;
  box-shadow:0 4px 20px rgba(100,70,10,.28);
}
.cal-btn svg{
  width:13px;height:13px;flex-shrink:0;
  stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
}
</style>
</head>
<body>

<div class="card">
  <img
    src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT Image Jun 19, 2026, 04_24_00 PM.png"
    alt="Apurva &amp; Nikhil Save the Date — 06 December 2026, Bangalore, India"
  />

  <a class="cal-btn"
     href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Apurva+%26+Nikhil+Wedding&dates=20261206%2F20261207&location=Bangalore%2C+India&details=Save+the+Date+for+Apurva+%26+Nikhil%27s+Wedding+%E2%80%94+06+December+2026%2C+Bangalore%2C+India"
     target="_blank"
     rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    Add to Calendar
  </a>
</div>

</body>
</html>
