<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apurva &amp; Nikhil · Save the Date · 06 December 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  height:100%;
  background:#F0E8D8;
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',Georgia,serif;
  overflow:hidden;
}

/* Blurred bleed of the same image fills the entire background */
.bg-blur{
  position:fixed;inset:0;z-index:0;
  background-image:url('https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT%20Image%20Jun%2019%2C%202026%2C%2004_24_00%20PM.png');
  background-size:cover;
  background-position:center top;
  filter:blur(28px) brightness(1.08) saturate(.7);
  transform:scale(1.08); /* hides blur edges */
}

/* Cream tint over the blurred bg so it reads as warm paper, not photo */
.bg-blur::after{
  content:'';
  position:absolute;inset:0;
  background:rgba(240,232,210,0.62);
}

/* Card sits above the blurred bg */
.card{
  position:relative;z-index:1;
  /* Fill most of the viewport height, constrain width */
  height:min(96vh, 700px);
  width:auto;
  aspect-ratio:3/4;
  max-width:92vw;
}

.card img{
  height:100%;width:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
  border-radius:3px;
  /* Feathered edges blend into the bg */
  -webkit-mask-image:radial-gradient(ellipse 96% 96% at 50% 50%, black 70%, transparent 100%);
  mask-image:radial-gradient(ellipse 96% 96% at 50% 50%, black 70%, transparent 100%);
  box-shadow:
    0 0 60px rgba(200,170,110,.35),
    0 12px 48px rgba(80,50,20,.18);
}

.cal-btn{
  position:absolute;
  top:67%;
  left:50%;
  transform:translateX(-50%);
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 18px;
  background:rgba(248,242,230,.82);
  border:1px solid rgba(179,146,69,.45);
  color:#8A6A24;
  font-family:'Playfair Display',serif;
  font-size:9px;
  letter-spacing:.22em;
  text-transform:uppercase;
  text-decoration:none;
  border-radius:999px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
  transition:background .25s,color .25s,box-shadow .25s;
}
.cal-btn:hover{
  background:rgba(179,146,69,.85);
  color:#FAF5E8;
  box-shadow:0 4px 16px rgba(100,70,10,.22);
}
.cal-btn:active{transform:translateX(-50%) scale(.97)}
.cal-btn svg{
  width:10px;height:10px;flex-shrink:0;
  stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

#mus-btn{
  position:fixed;
  bottom:20px;right:20px;z-index:10;
  width:40px;height:40px;
  background:rgba(248,242,230,.82);
  border:1px solid rgba(179,146,69,.45);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:background .25s,transform .2s;
}
#mus-btn:hover{background:rgba(179,146,69,.85);transform:scale(1.08)}
#mus-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:#8A6A24;transition:color .25s}
#mus-btn:hover svg{color:#FAF5E8}
#mus-btn.playing svg{color:#8A6A24}
</style>
</head>
<body>

<div class="bg-blur"></div>

<div class="card">
  <img
    src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT%20Image%20Jun%2019%2C%202026%2C%2004_24_00%20PM.png"
    alt="Apurva &amp; Nikhil Save the Date — 06 December 2026, Bangalore, India"
  />
  <a class="cal-btn"
     href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Apurva+%26+Nikhil+Wedding&dates=20261206%2F20261207&location=Bangalore%2C+India&details=Save+the+Date+for+Apurva+%26+Nikhil%27s+Wedding"
     target="_blank"
     rel="noopener">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </svg>
    <span>Add to Calendar</span>
  </a>
</div>


<audio id="aud" loop>
  <source src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/mp3/Jashn-E-Bahaaraa%20(Instrumental%20-%20Flute)%20-%20A.%20R.%20Rahman.mp3" type="audio/mpeg"/>
</audio>

<button id="mus-btn" aria-label="Play music">
  <!-- Play icon (default) -->
  <svg id="icon-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
  <!-- Pause icon (hidden until playing) -->
  <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>
</button>

<script>
const btn  = document.getElementById('mus-btn');
const aud  = document.getElementById('aud');
const play = document.getElementById('icon-play');
const pause= document.getElementById('icon-pause');
let going  = false;

btn.addEventListener('click', () => {
  if (!going) {
    aud.play().catch(()=>{});
    play.style.display  = 'none';
    pause.style.display = 'block';
  } else {
    aud.pause();
    play.style.display  = 'block';
    pause.style.display = 'none';
  }
  going = !going;
});
</script>

</body>
</html>
