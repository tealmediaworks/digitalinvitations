<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apurva &amp; Nikhil · Save the Date · 06 December 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;
  background:#E4DDD5;
  display:flex;align-items:center;justify-content:center;
  padding:20px 12px;
  font-family:'Playfair Display',Georgia,serif;
}

.card{
  position:relative;
  width:min(480px,100%);
}

.card img{
  width:100%;display:block;border-radius:2px;
  box-shadow:0 8px 32px rgba(50,30,10,.18),0 2px 8px rgba(50,30,10,.1);
}

/* Clickable zone over "06TH DECEMBER 2026 / BANGALORE, INDIA" */
.date-zone{
  position:absolute;
  top:45%;
  left:18%;
  width:64%;
  height:9%;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:2px;
  /* Subtle permanent gold underline so it's findable */
  border-bottom: 1.5px solid rgba(180,140,40,.45);
}

/* Overlay that appears on hover */
.date-zone .overlay{
  position:absolute;
  inset:0;
  background:rgba(245,237,210,0.82);
  border:1px solid rgba(180,140,40,.6);
  border-radius:2px;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  opacity:0;
  transition:opacity .25s ease;
}

.date-zone:hover .overlay,
.date-zone:focus .overlay{
  opacity:1;
}

.overlay-text{
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(9px,2.2vw,12px);
  font-weight:500;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:#6B4E10;
  white-space:nowrap;
}

.overlay svg{
  width:14px;height:14px;flex-shrink:0;
  stroke:#6B4E10;fill:none;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
</style>
</head>
<body>

<div class="card">
  <img
    src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT%20Image%20Jun%2019%2C%202026%2C%2004_24_00%20PM.png"
    alt="Apurva &amp; Nikhil Save the Date — 06 December 2026, Bangalore, India"
  />

  <a class="date-zone"
     href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Apurva+%26+Nikhil+Wedding&dates=20261206%2F20261207&location=Bangalore%2C+India&details=Save+the+Date+for+Apurva+%26+Nikhil%27s+Wedding+%E2%80%94+06+December+2026%2C+Bangalore%2C+India"
     target="_blank"
     rel="noopener"
     aria-label="Add Apurva & Nikhil's wedding to your calendar">

    <div class="overlay">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span class="overlay-text">Add to Calendar</span>
    </div>

  </a>
</div>

</body>
</html>
