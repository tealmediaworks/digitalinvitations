<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apurva &amp; Nikhil · Save the Date · 06 December 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;width:100%;overflow:hidden;
  font-family:'Playfair Display',Georgia,serif;
  background:#EDE3D0;
}

/* ── BLURRED BG ── */
.bg{
  position:fixed;inset:0;z-index:0;
  background:url('https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT%20Image%20Jun%2019%2C%202026%2C%2004_24_00%20PM.png') center top/cover no-repeat;
  filter:blur(32px) brightness(1.05) saturate(.6);
  transform:scale(1.1);
}
.bg::after{content:'';position:absolute;inset:0;background:rgba(237,224,200,.65)}

/* ── STAGE ── */
.stage{
  position:fixed;inset:0;z-index:1;
  display:flex;align-items:center;justify-content:center;
}

/* ══════════════════════════════
   ENVELOPE SCENE
   — sits in the stage, fades out after open
══════════════════════════════ */
.env-scene{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .6s ease, visibility .6s ease;
  z-index:2;
}
.env-scene.hide{opacity:0;visibility:hidden;pointer-events:none}

.env-wrap{
  position:relative;
  width:min(320px,82vw);
}

/* Envelope body */
.envelope{
  position:relative;
  width:100%;
  padding-bottom:66%;
  cursor:pointer;
  transition:transform .3s ease;
}
.envelope:hover{transform:translateY(-5px)}
.envelope.opened{cursor:default;transform:none}

.env-back{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#EDD8A8 0%,#D4BA78 40%,#C8A850 100%);
  border-radius:4px 4px 6px 6px;
  box-shadow:0 14px 52px rgba(80,50,10,.28),0 4px 12px rgba(80,50,10,.15);
  overflow:hidden;
}
.env-back::before{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.06'/%3E%3C/svg%3E");
  background-size:200px;mix-blend-mode:multiply;
}

.env-flap-left{
  position:absolute;bottom:0;left:0;width:0;height:0;z-index:2;
  border-bottom:solid calc(50% + 4px) #C8A040;
  border-right:solid 50% transparent;
  filter:brightness(.88);
}
.env-flap-right{
  position:absolute;bottom:0;right:0;width:0;height:0;z-index:2;
  border-bottom:solid calc(50% + 4px) #C8A040;
  border-left:solid 50% transparent;
  filter:brightness(.82);
}
.env-bottom{
  position:absolute;bottom:0;left:0;right:0;z-index:1;
  height:0;width:0;
  border-left:solid 50% transparent;
  border-right:solid 50% transparent;
  border-bottom:solid 52% #B8902A;
  margin:0 auto;
  filter:brightness(.9);
}
.env-flap-top{
  position:absolute;top:0;left:0;right:0;z-index:5;
  transform-origin:top center;
  transform-style:preserve-3d;
  transition:transform .85s cubic-bezier(.4,0,.2,1);
  height:0;width:0;
  border-left:solid 50% transparent;
  border-right:solid 50% transparent;
  border-top:solid 52% #D4AF50;
  margin:0 auto;
  filter:drop-shadow(0 4px 6px rgba(80,50,10,.2));
}
.env-flap-top.open{transform:rotateX(180deg)}

.env-lines{position:absolute;inset:8px;border:1px solid rgba(255,220,100,.35);border-radius:2px;z-index:3;pointer-events:none}

.env-corner-tl,.env-corner-br{
  position:absolute;z-index:4;font-size:clamp(16px,4.5vw,22px);
  opacity:.5;pointer-events:none;line-height:1;
  filter:sepia(1) saturate(1.5) hue-rotate(-10deg);
}
.env-corner-tl{top:6px;left:8px}
.env-corner-br{bottom:6px;right:8px;transform:rotate(180deg)}

.env-mono{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
.env-mono-inner{display:flex;flex-direction:column;align-items:center;gap:3px}
.env-mono-text{
  font-size:clamp(16px,4.5vw,24px);font-weight:400;letter-spacing:.18em;
  color:rgba(80,55,10,.72);line-height:1;
}
.env-mono-sub{
  font-style:italic;font-size:clamp(7px,2vw,10px);
  color:rgba(80,55,10,.45);letter-spacing:.2em;
}

/* Wax seal */
.seal{
  position:absolute;
  top:21%;left:50%;transform:translateX(-50%);
  width:clamp(36px,9vw,48px);height:clamp(36px,9vw,48px);
  z-index:8;
  transition:opacity .3s ease;
}
.seal.hide{opacity:0}

/* SVG envelope body decoration */
.env-deco{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;z-index:3}

/* Hint */
.env-hint{
  margin-top:16px;text-align:center;
  font-style:italic;font-size:clamp(10px,2.5vw,12px);
  color:rgba(100,70,20,.48);letter-spacing:.1em;
  animation:pulse 2.5s ease-in-out infinite;
  transition:opacity .3s;
}
.env-hint.hide{opacity:0}
@keyframes pulse{0%,100%{opacity:.48}50%{opacity:.9}}

/* ══════════════════════════════
   INVITE — revealed after open
══════════════════════════════ */
.invite-scene{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transition:opacity .8s ease .4s, visibility .8s ease .4s;
  z-index:3;
  padding:16px 12px;
}
.invite-scene.show{opacity:1;visibility:visible}

.invite-card{
  position:relative;
  width:min(400px,90vw);
  height:min(90vh,620px);
}
.invite-card img{
  width:100%;height:100%;
  object-fit:cover;object-position:center top;
  display:block;border-radius:3px;
  box-shadow:0 12px 48px rgba(80,50,10,.25),0 4px 12px rgba(80,50,10,.12);
  -webkit-mask-image:radial-gradient(ellipse 96% 97% at 50% 50%,black 72%,transparent 100%);
  mask-image:radial-gradient(ellipse 96% 97% at 50% 50%,black 72%,transparent 100%);
}

/* Cal button */
.cal-btn{
  position:absolute;
  top:67%;left:50%;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;
  background:rgba(248,242,230,.82);
  border:1px solid rgba(179,146,69,.45);
  color:#8A6A24;
  font-size:8px;letter-spacing:.22em;text-transform:uppercase;
  text-decoration:none;border-radius:999px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;transition:background .25s,color .25s;
}
.cal-btn:hover{background:rgba(179,146,69,.85);color:#FAF5E8}
.cal-btn:active{transform:translateX(-50%) scale(.97)}
.cal-btn svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ── MUSIC BTN ── */
#mus-btn{
  position:fixed;bottom:20px;right:20px;z-index:20;
  width:42px;height:42px;
  background:rgba(248,242,230,.85);
  border:1px solid rgba(179,146,69,.45);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;
  transition:opacity .5s ease,background .25s,transform .2s;
}
#mus-btn.show{opacity:1;pointer-events:auto}
#mus-btn:hover{background:rgba(179,146,69,.85);transform:scale(1.08)}
#mus-btn svg{width:15px;height:15px;fill:none;stroke:#8A6A24;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
#mus-btn:hover svg{stroke:#FAF5E8}

/* Floating notes */
.note{
  position:fixed;pointer-events:none;z-index:15;
  color:rgba(139,105,20,.55);
  animation:floatNote linear forwards;opacity:0;
}
@keyframes floatNote{
  0%{opacity:0;transform:translateY(0) rotate(-8deg) scale(.8)}
  15%{opacity:.75}80%{opacity:.4}
  100%{opacity:0;transform:translateY(-80px) rotate(16deg) scale(1.1)}
}

/* Sparks */
.spark{
  position:fixed;pointer-events:none;z-index:15;border-radius:50%;
  animation:sparkFly linear forwards;
}
@keyframes sparkFly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}
}
</style>
</head>
<body>

<div class="bg"></div>

<audio id="aud" loop>
  <source src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/mp3/Jashn-E-Bahaaraa%20(Instrumental%20-%20Flute)%20-%20A.%20R.%20Rahman.mp3" type="audio/mpeg"/>
</audio>

<div class="stage">

  <!-- ── ENVELOPE SCENE ── -->
  <div class="env-scene" id="env-scene">
    <div class="env-wrap">
      <div class="envelope" id="envelope">

        <div class="env-back">
          <div class="env-lines"></div>
          <svg class="env-deco" viewBox="0 0 320 210" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <path d="M160,25 L210,105 L160,185 L110,105 Z" stroke="#8B6914" stroke-width=".8" fill="none"/>
            <path d="M160,50 L195,105 L160,160 L125,105 Z" stroke="#8B6914" stroke-width=".5" fill="none"/>
            <path d="M20,20 Q30,10 42,20 Q52,30 42,42" stroke="#8B6914" stroke-width=".8" fill="none"/>
            <path d="M300,20 Q290,10 278,20 Q268,30 278,42" stroke="#8B6914" stroke-width=".8" fill="none"/>
            <path d="M20,190 Q30,200 42,190 Q52,180 42,168" stroke="#8B6914" stroke-width=".8" fill="none"/>
            <path d="M300,190 Q290,200 278,190 Q268,180 278,168" stroke="#8B6914" stroke-width=".8" fill="none"/>
            <line x1="28" y1="105" x2="100" y2="105" stroke="#8B6914" stroke-width=".4" opacity=".5"/>
            <line x1="220" y1="105" x2="292" y2="105" stroke="#8B6914" stroke-width=".4" opacity=".5"/>
          </svg>
        </div>

        <div class="env-flap-left"></div>
        <div class="env-flap-right"></div>
        <div class="env-bottom"></div>
        <div class="env-corner-tl">🌸</div>
        <div class="env-corner-br">🌸</div>

        <div class="env-mono">
          <div class="env-mono-inner">
            <div class="env-mono-text">A &nbsp;|&nbsp; N</div>
            <div class="env-mono-sub">Save the Date</div>
          </div>
        </div>

        <div class="env-flap-top" id="flap-top"></div>

        <div class="seal" id="seal">
          <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="sg" cx="40%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#D4A030"/>
                <stop offset="60%" stop-color="#A87020"/>
                <stop offset="100%" stop-color="#7A5010"/>
              </radialGradient>
            </defs>
            <polygon points="30,2 33,22 52,12 38,26 58,30 38,34 52,48 33,38 30,58 27,38 8,48 22,34 2,30 22,26 8,12 27,22" fill="url(#sg)" opacity=".9"/>
            <circle cx="30" cy="30" r="16" fill="url(#sg)"/>
            <circle cx="30" cy="30" r="13" fill="none" stroke="rgba(255,220,100,.5)" stroke-width=".8"/>
            <text x="30" y="35" font-family="'Playfair Display',Georgia,serif" font-size="12" font-weight="500" fill="rgba(255,248,220,.9)" text-anchor="middle" letter-spacing="2">AN</text>
          </svg>
        </div>

      </div><!-- /envelope -->

      <div class="env-hint" id="hint">✦ &nbsp; Tap to open &nbsp; ✦</div>
    </div>
  </div>

  <!-- ── INVITE SCENE ── -->
  <div class="invite-scene" id="invite-scene">
    <div class="invite-card">
      <img
        src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT%20Image%20Jun%2019%2C%202026%2C%2004_24_00%20PM.png"
        alt="Apurva & Nikhil Save the Date — 06 December 2026, Bangalore, India"
      />
      <a class="cal-btn"
         href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Apurva+%26+Nikhil+Wedding&dates=20261206%2F20261207&location=Bangalore%2C+India&details=Save+the+Date+for+Apurva+%26+Nikhil%27s+Wedding"
         target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Add to Calendar</span>
      </a>
    </div>
  </div>

</div>

<!-- Music button -->
<button id="mus-btn" aria-label="Toggle music">
  <svg id="icon-play" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21" fill="#8A6A24"/></svg>
  <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><line x1="6" y1="4" x2="6" y2="20"/><line x1="18" y1="4" x2="18" y2="20"/></svg>
</button>

<script>
const envelope    = document.getElementById('envelope');
const flapTop     = document.getElementById('flap-top');
const seal        = document.getElementById('seal');
const hint        = document.getElementById('hint');
const envScene    = document.getElementById('env-scene');
const inviteScene = document.getElementById('invite-scene');
const musBtn      = document.getElementById('mus-btn');
const aud         = document.getElementById('aud');
const iconPlay    = document.getElementById('icon-play');
const iconPause   = document.getElementById('icon-pause');
let opened = false, playing = false, noteInterval;

envelope.addEventListener('click', () => {
  if (opened) return;
  opened = true;
  envelope.classList.add('opened');
  hint.classList.add('hide');

  // 1. Seal disappears + sparks
  const sr = seal.getBoundingClientRect();
  spawnSparks(sr.left + sr.width/2, sr.top + sr.height/2, 18);
  seal.classList.add('hide');

  // 2. Flap opens
  setTimeout(() => flapTop.classList.add('open'), 200);

  // 3. Envelope fades out behind
  setTimeout(() => envScene.classList.add('hide'), 800);

  // 4. Invite fades in on top
  setTimeout(() => inviteScene.classList.add('show'), 900);

  // 5. Music + music btn
  setTimeout(() => {
    aud.play().catch(() => {});
    playing = true;
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    musBtn.classList.add('show');
    startNotes();
  }, 1100);
});

/* Music toggle */
musBtn.addEventListener('click', () => {
  if (!playing) {
    aud.play().catch(() => {});
    iconPlay.style.display = 'none';
    iconPause.style.display = 'block';
    playing = true;
    startNotes();
  } else {
    aud.pause();
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
    playing = false;
  }
});

/* Floating music notes */
const noteSymbols = ['♪','♫','♩','♬'];
function spawnNote() {
  const r = musBtn.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'note';
  el.textContent = noteSymbols[Math.floor(Math.random() * noteSymbols.length)];
  el.style.cssText = `
    left:${r.left + r.width/2 + (Math.random()-0.5)*20}px;
    top:${r.top - 2}px;
    font-size:${11+Math.random()*6}px;
    animation-duration:${2+Math.random()*1.2}s;
  `;
  document.body.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}
function startNotes() {
  clearInterval(noteInterval);
  noteInterval = setInterval(() => { if (playing) spawnNote(); }, 950);
}

/* Sparks */
function spawnSparks(cx, cy, count) {
  const cols = ['#D4AF50','#EDD98A','#C8A030','#F0D060','#fffde0'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'spark';
    const angle = (i / count) * Math.PI * 2;
    const dist  = 28 + Math.random() * 55;
    const size  = 3 + Math.random() * 4;
    el.style.cssText = `
      left:${cx}px;top:${cy}px;
      width:${size}px;height:${size}px;
      background:${cols[Math.floor(Math.random()*cols.length)]};
      --tx:${Math.cos(angle)*dist}px;
      --ty:${Math.sin(angle)*dist}px;
      animation-duration:${0.45+Math.random()*0.45}s;
      animation-delay:${Math.random()*0.12}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}
</script>
</body>
</html>
