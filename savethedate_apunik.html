<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apurva &amp; Nikhil · Save the Date · 06 December 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;background:#E4DDD5;
  display:flex;align-items:center;justify-content:center;
  padding:20px 12px;
  font-family:'Playfair Display',Georgia,serif;
}

.card{
  position:relative;
  width:min(480px,100%);
}

.card img{
  width:100%;display:block;border-radius:2px;
  box-shadow:0 8px 32px rgba(50,30,10,.18),0 2px 8px rgba(50,30,10,.1);
}

/* ── INVISIBLE HOTSPOT over the date+location text ── */
.date-hotspot{
  position:absolute;
  /* Adjust these to sit exactly over "06TH DECEMBER 2026 / BANGALORE, INDIA" in your image */
  top:67%;
  left:20%;
  width:60%;
  height:8%;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:2px;

  /* Transparent by default */
  background:transparent;
  border:1.5px solid transparent;
  transition:background .3s ease, border-color .3s ease, backdrop-filter .3s ease;
}

/* Tooltip label — hidden until hover */
.date-hotspot .tooltip{
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%);
  background:rgba(245,238,220,0.96);
  border:0.5px solid rgba(180,140,40,.6);
  color:#6B4E10;
  font-family:'Playfair Display',Georgia,serif;
  font-size:clamp(8px,1.8vw,10px);
  font-weight:400;
  letter-spacing:.3em;
  text-transform:uppercase;
  padding:8px 18px;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transform:translateX(-50%) translateY(4px);
  transition:opacity .25s ease, transform .25s ease;
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  box-shadow:0 2px 12px rgba(100,70,10,.15);
}

/* Tooltip arrow */
.date-hotspot .tooltip::after{
  content:'';
  position:absolute;
  top:100%;left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:rgba(180,140,40,.5);
}

/* Hover state */
.date-hotspot:hover{
  background:rgba(250,245,230,0.18);
  border-color:rgba(180,140,40,.4);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}
.date-hotspot:hover .tooltip{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* Calendar icon inside tooltip */
.tooltip svg{
  width:11px;height:11px;
  stroke:currentColor;fill:none;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
  vertical-align:middle;margin-right:6px;margin-top:-1px;
}
</style>
</head>
<body>

<div class="card">
  <img
    src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT%20Image%20Jun%2019%2C%202026%2C%2004_24_00%20PM.png"
    alt="Apurva &amp; Nikhil Save the Date — 06 December 2026, Bangalore, India"
  />

  <!-- Invisible clickable zone over the date & location text -->
  <a class="date-hotspot"
     href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Apurva+%26+Nikhil+Wedding&dates=20261206%2F20261207&location=Bangalore%2C+India&details=Save+the+Date+for+Apurva+%26+Nikhil%27s+Wedding+%E2%80%94+06+December+2026%2C+Bangalore%2C+India"
     target="_blank"
     rel="noopener"
     aria-label="Add Apurva & Nikhil's wedding to your calendar">
    <span class="tooltip">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Add to Calendar
    </span>
  </a>
</div>

</body>
</html>
