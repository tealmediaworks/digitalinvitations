<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Apurva &amp; Nikhil · Save the Date · 06 December 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100%;
  background:#E4DDD5;
  display:flex;align-items:center;justify-content:center;
  padding:20px 12px;
  font-family:'Playfair Display',Georgia,serif;
}

.card{
  position:relative;
  width:min(480px,100%);
}

.card img{
  width:100%;display:block;border-radius:2px;
  box-shadow:0 8px 32px rgba(50,30,10,.18),0 2px 8px rgba(50,30,10,.1);
}

/* Clickable zone over "06TH DECEMBER 2026 / BANGALORE, INDIA" */
.cal-btn{
  position:absolute;
  top:67%;
  left:50%;
  transform:translateX(-50%);

  display:inline-flex;
  align-items:center;
  gap:6px;

  padding:8px 18px;

  background:rgba(248,242,230,.82);
  border:1px solid rgba(179,146,69,.45);

  color:#8A6A24;

  font-family:'Playfair Display',serif;
  font-size:9px;
  letter-spacing:.22em;
  text-transform:uppercase;
  text-decoration:none;

  border-radius:999px;

  box-shadow:0 2px 10px rgba(0,0,0,.08);

  backdrop-filter:blur(8px);
}
.cal-btn:active{
    transform:translateX(-50%) scale(.97);
}
.cal-btn svg{
  width:10px;height:10px;flex-shrink:0;
  stroke:currentColor;fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}
</style>
</head>
<body>

<div class="card">
  <img
    src="https://raw.githubusercontent.com/tealmediaworks/digitalinvitations/main/img/ChatGPT%20Image%20Jun%2019%2C%202026%2C%2004_24_00%20PM.png"
    alt="Apurva &amp; Nikhil Save the Date — 06 December 2026, Bangalore, India"
  />

<a class="cal-btn"
   href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Apurva+%26+Nikhil+Wedding&dates=20261206%2F20261207&location=Bangalore%2C+India&details=Save+the+Date+for+Apurva+%26+Nikhil%27s+Wedding"
   target="_blank"
   rel="noopener">

<svg viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="18" rx="2"/>
    <line x1="16" y1="2" x2="16" y2="6"/>
    <line x1="8" y1="2" x2="8" y2="6"/>
    <line x1="3" y1="10" x2="21" y2="10"/>
</svg>

<span>Add to Calendar</span>

</a>
</div>

</body>
</html>
